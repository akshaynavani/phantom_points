# Reference sensor profile used as the realism target when generating training pairs
# (`phantom_gen --pair-config configs/reference_sensor.ini`). It overrides only the
# sensor response, never the beam layout, so source and reference scans share the
# same (ring, column) grid. Calibrate these values against logged data from the real
# sensor you want to imitate (see python/analyze.py --reference).

[noise]
range_sigma_base = 0.025
range_sigma_rel = 0.0015
dropout_base = 0.02
dropout_range_coeff = 0.15
detect_threshold = 0.008
detect_softness = 0.003
mixed_pixel_prob = 0.6
intensity_noise_rel = 0.08
spurious_per_scan = 60

[intensity]
falloff_exponent = 1.7
attenuation = 0.003
retro_exponent = 20.0
near_field_range = 3.5
