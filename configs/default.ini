# phantom_points default configuration: 64-beam spinning LiDAR (HDL-64-like FOV),
# urban street scenes. Every key is optional; omitted keys use built-in defaults.

[scene]
road_half_width = 7.0
sidewalk_width = 3.0
extent = 80.0
cars_min = 4
cars_max = 18
trucks_min = 0
trucks_max = 3
pedestrians_min = 0
pedestrians_max = 12
cyclists_min = 0
cyclists_max = 4
poles_min = 6
poles_max = 20
trees_min = 4
trees_max = 20
buildings_min = 4
buildings_max = 12
p_intersection = 0.30
p_parking = 0.15
sensor_clearance = 3.0

[lidar]
beams = 64
elevation_min_deg = -24.8
elevation_max_deg = 2.0
columns = 2048
min_range = 0.9
max_range = 120.0
sensor_height = 1.73
beam_divergence_mrad = 3.0
edge_samples = 4

[noise]
enabled = true
range_sigma_base = 0.015
range_sigma_rel = 0.0008
azimuth_jitter_deg = 0.01
elevation_jitter_deg = 0.005
dropout_base = 0.01
dropout_range_coeff = 0.08
detect_threshold = 0.004
detect_softness = 0.002
mixed_pixel_prob = 0.3
edge_depth_jump = 0.6
intensity_noise_rel = 0.05
quantize_intensity = true
spurious_per_scan = 30

[intensity]
gain = 1.0
reference_range = 10.0
falloff_exponent = 2.0
near_field_range = 2.0
attenuation = 0.0015
retro_exponent = 12.0
saturation = 1.0
