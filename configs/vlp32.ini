# 32-beam sensor with a non-uniform elevation table (dense around the horizon),
# VLP-32C-like. Noise and intensity sections fall back to defaults.

[lidar]
elevations_deg = -25.0, -15.639, -11.31, -8.843, -7.254, -6.148, -5.333, -4.667, -4.0, -3.667, -3.333, -3.0, -2.667, -2.333, -2.0, -1.667, -1.333, -1.0, -0.667, -0.333, 0.0, 0.333, 0.667, 1.0, 1.333, 1.667, 2.333, 3.333, 4.667, 7.0, 10.333, 15.0
columns = 1800
max_range = 200.0
sensor_height = 1.9
beam_divergence_mrad = 3.0

[noise]
range_sigma_base = 0.03
spurious_per_scan = 15

[intensity]
falloff_exponent = 1.8
